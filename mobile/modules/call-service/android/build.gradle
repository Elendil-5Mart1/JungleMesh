// Local module (Expo autolinking reads mobile/modules/ by default): the calls' foreground service
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.junglemesh'
version = '1.0.0'

android {
  namespace "org.junglemesh.callservice"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
