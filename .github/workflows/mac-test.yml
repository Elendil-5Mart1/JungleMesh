name: Mac test build

# Builds the macOS app (.dmg, Apple Silicon and Intel) for testers, on demand: Actions › Mac test build › Run workflow.
# No tag, no release: the .dmg files are attached to the run (Artifacts, at the bottom of its page).
# Not signed by an Apple developer account (ad-hoc signature only): see manual.md for how a tester opens it.
on:
  workflow_dispatch:
    inputs:
      electron:
        description: 'Older Electron for an older macOS, e.g. 37 for macOS 11 Big Sur (test only: no more security fixes). Empty = the project version.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false # never look for a signing certificate in the runner's keychain
      ELECTRON_VERSION: ${{ inputs.electron }} # (through env, never pasted into the shell command)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Older Electron for this run only (package.json and the lockfile stay untouched)
      - if: inputs.electron != ''
        run: npm install --no-save "electron@$ELECTRON_VERSION"
      - run: npm run typecheck
      - name: Build
        run: |
          if [ -n "$ELECTRON_VERSION" ]; then
            npm run dist:mac -- "-c.electronVersion=$(node -p "require('electron/package.json').version")"
          else
            npm run dist:mac
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: JungleMesh-mac${{ inputs.electron && format('-electron{0}', inputs.electron) || '' }}
          path: dist/*.dmg
          retention-days: 14
