name: Release

# Builds the Windows installer when a version tag is pushed (git tag v0.1.0 && git push --tags)
# and attaches it, with its SHA-256, to a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run dist
      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/JungleMesh-Setup-*.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/JungleMesh-Setup-*.exe dist/JungleMesh-Setup-*.exe.sha256 dist/JungleMesh-Setup-*.exe.blockmap dist/latest.yml --draft --generate-notes --title "${{ github.ref_name }}"
