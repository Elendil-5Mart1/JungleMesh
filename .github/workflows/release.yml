name: Release

# Builds the Windows installer and the Linux packages when a version tag is pushed (git tag v0.1.0 && git push --tags)
# and attaches it, with its SHA-256, to a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run dist
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/JungleMesh-Setup-*.exe dist/JungleMesh-Setup-*.exe.blockmap dist/latest.yml --draft --generate-notes --title "${{ github.ref_name }}"

  linux:
    # Runs after the Windows job, which creates the draft release: this one only adds files to it
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - name: Add to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/JungleMesh-*.AppImage dist/JungleMesh-*.deb dist/latest-linux.yml
