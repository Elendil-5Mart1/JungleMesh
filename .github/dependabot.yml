version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # koffi 3 downloads its binary in an install script (blocked by allowScripts); 2.x ships it in the package
      - dependency-name: koffi
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site # landing page (Vite, Sass, fonts)
    schedule:
      interval: weekly
